<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Spirograph Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Monoton&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: square sheet of paper on the left, a toolbox of gears, pens and motion controls on the right; stacks on phones. */
:root{
  --bg:#e7ebf2; --panel:#f8f9fc; --fg:#1a1e2c; --muted:#5b6278; --line:#d2d8e4; --chip:#eef1f7;
  --accent:#2445d0; --accent-ink:#ffffff; --shadow:0 1px 2px rgba(20,30,60,.08),0 12px 32px rgba(20,30,60,.12);
  --display:'Monoton','Impact',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1017; --panel:#161922; --fg:#e6e8f1; --muted:#959bb0; --line:#292e3c; --chip:#1e222e;
  --accent:#8499ff; --accent-ink:#0e1017; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1017; --panel:#161922; --fg:#e6e8f1; --muted:#959bb0; --line:#292e3c; --chip:#1e222e;
  --accent:#8499ff; --accent-ink:#0e1017; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px rgba(0,0,0,.45); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.45}
.app{max-width:1220px;margin:0 auto;padding-inline:16px;padding-block:18px 32px;display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}
@media (max-width:860px){.app{grid-template-columns:minmax(0,1fr)}}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);letter-spacing:.02em;margin:0;line-height:1;color:var(--accent)}
.tag{color:var(--muted);margin:0;font-size:15px}
.stage{display:flex;flex-direction:column;gap:10px;min-width:0}
.sheet{position:relative;width:100%;max-width:min(100%,max(320px,calc(100vh - 150px)));aspect-ratio:1;margin-inline:auto;border-radius:4px;box-shadow:var(--shadow);overflow:hidden}
.sheet canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.readout{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px;font-family:var(--mono);font-size:12.5px;color:var(--muted);width:100%;max-width:min(100%,max(320px,calc(100vh - 150px)));margin-inline:auto;font-variant-numeric:tabular-nums}
.readout b{color:var(--fg);font-weight:500}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:18px;min-width:0}
.group{display:flex;flex-direction:column;gap:8px}
.label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.label output{font-family:var(--mono);font-weight:500;letter-spacing:0;text-transform:none;color:var(--fg);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:12.5px;min-width:38px;padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover:not(:disabled){border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{font:inherit;font-weight:500;padding:7px 8px;border:0;background:var(--chip);color:var(--fg);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=range]{width:100%;accent-color:var(--accent);margin:0}
.swatches{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.sw{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.sw[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:2px;border-color:var(--panel)}
.custom{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.custom input{width:34px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.check{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px}
.check input{accent-color:var(--accent);width:16px;height:16px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.btn{font:inherit;font-weight:500;padding:9px 10px;border-radius:7px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{grid-column:1/-1;background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-size:15px;padding:11px}
.btn.wide{grid-column:1/-1}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:12.5px;color:var(--muted);margin:0}
</style>

<div class="app">
  <header>
    <h1>Spirograph</h1>
    <p class="tag">Pick a ring and a wheel, put the pen in a hole, and let it roll.</p>
  </header>

  <section class="stage">
    <div class="sheet" id="sheet">
      <canvas id="paper" aria-label="Spirograph drawing"></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>
    </div>
    <div class="readout">
      <span id="statShape"></span>
      <span id="statProgress"></span>
    </div>
  </section>

  <aside class="panel">
    <div class="group">
      <div class="label">Wheel rolls</div>
      <div class="seg" id="modeSeg">
        <button id="modeIn" data-mode="in">Inside a ring</button>
        <button id="modeOut" data-mode="out">Around a gear</button>
      </div>
    </div>

    <div class="group">
      <div class="label"><span id="ringLabel">Ring · teeth</span></div>
      <div class="chips" id="ringChips"></div>
    </div>

    <div class="group">
      <div class="label"><span>Wheel · teeth</span></div>
      <div class="chips" id="wheelChips"></div>
    </div>

    <div class="group">
      <div class="label"><label for="hole">Pen hole</label><output id="holeOut"></output></div>
      <input type="range" id="hole" min="10" max="95" step="1">
    </div>

    <div class="group">
      <div class="label"><label for="tooth">Start at tooth</label><output id="toothOut"></output></div>
      <input type="range" id="tooth" min="0" max="149" step="1">
    </div>

    <div class="group">
      <div class="label"><span>Pen</span></div>
      <div class="swatches" id="swatches"></div>
      <label class="custom" for="customColor">Any color <input type="color" id="customColor" value="#2f56e0"></label>
    </div>

    <div class="group">
      <div class="label"><label for="width">Line width</label><output id="widthOut"></output></div>
      <input type="range" id="width" min="0.5" max="4" step="0.25">
    </div>

    <div class="group">
      <div class="label"><label for="speed">Speed</label><output id="speedOut"></output></div>
      <input type="range" id="speed" min="1" max="10" step="1">
    </div>

    <div class="group">
      <div class="label"><span>Paper</span></div>
      <div class="seg" id="paperSeg">
        <button id="paperWhite" data-paper="white">White</button>
        <button id="paperBlack" data-paper="black">Black</button>
      </div>
      <label class="check" for="showGears"><input type="checkbox" id="showGears" checked> Show the gears</label>
    </div>

    <div class="actions">
      <button class="btn primary" id="drawBtn">Draw</button>
      <button class="btn" id="finishBtn">Finish instantly</button>
      <button class="btn" id="surpriseBtn">Surprise me</button>
      <button class="btn" id="undoBtn">Undo layer</button>
      <button class="btn" id="clearBtn">Clear paper</button>
    </div>
    <p class="hint">Change the pen color mid-drawing to switch pens. Changing a gear, hole or start tooth lifts the wheel, so the next Draw starts a new layer on top.</p>
  </aside>
</div>

<script>
(() => {
const RINGS = [96, 105, 144, 150];
const CENTERS = [24, 30, 32, 40, 48, 56, 63, 72, 80, 84];
const WHEELS = [24, 30, 32, 36, 40, 42, 45, 48, 52, 56, 60, 63, 64, 72, 75, 80, 84];
const LIMIT = 156; // paper radius in tooth units
const PENS = [
  ['Ink', '#1d1f2b'], ['Cobalt', '#2f56e0'], ['Teal', '#0f9b8e'], ['Leaf', '#3fae3a'],
  ['Marigold', '#f2a516'], ['Coral', '#f2603f'], ['Magenta', '#d6338a'], ['Violet', '#7b4fd8'],
  ['Gold gel', '#d9b45a'], ['White gel', '#f4f4ee']
];
const PAPER = { white: '#fdfdfb', black: '#0c0c10' };

const $ = id => document.getElementById(id);
const sheet = $('sheet'), paper = $('paper'), over = $('overlay');
const pctx = paper.getContext('2d'), octx = over.getContext('2d');

const root = document.documentElement;
const prefersDark = root.dataset.theme === 'dark' ||
  (root.dataset.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const state = {
  mode: 'in', R: 105, r: 40, hole: 0.9, tooth: 0,
  color: '#f2603f', width: 1.5, speed: 6, showGears: true,
  paper: prefersDark ? 'black' : 'white'
};
let layers = [];   // {mode,R,r,hole,alpha,T,t,segs:[{t0,t1,color,width}]}
let cur = null;    // layer being drawn (always the last in layers)
let running = false;
let dpr = 1, S = 1, C = 0;

const gcd = (a, b) => { while (b) [a, b] = [b, a % b]; return a; };
const ringList = () => state.mode === 'in' ? RINGS : CENTERS;
const wheelOk = r => state.mode === 'in' ? r < state.R : state.R + 2 * r <= LIMIT;

function makeLayer(p) {
  return {
    mode: p.mode, R: p.R, r: p.r, hole: p.hole,
    alpha: 2 * Math.PI * p.tooth / p.R,
    T: 2 * Math.PI * p.r / gcd(p.R, p.r), t: 0,
    segs: [{ t0: 0, t1: 0, color: p.color, width: p.width }]
  };
}

// Position of the wheel centre, its spin and the pen tip, in tooth units.
function geom(L, t) {
  const { R, r } = L;
  const inside = L.mode === 'in';
  const dist = inside ? R - r : R + r;
  const spin = (inside ? -(R - r) / r : (R + r) / r) * t + L.alpha;
  const th = t + L.alpha, d = L.hole * r;
  const wx = dist * Math.cos(th), wy = dist * Math.sin(th);
  return { wx, wy, spin, px: wx + d * Math.cos(spin), py: wy + d * Math.sin(spin) };
}
function stepFor(L) {
  const inside = L.mode === 'in';
  const dist = inside ? L.R - L.r : L.R + L.r;
  const k = inside ? (L.R - L.r) / L.r : (L.R + L.r) / L.r;
  return Math.min(0.02, 1.4 / (S * (dist + L.hole * L.r * k)));
}

function paintRange(L, t0, t1, color, width) {
  if (t1 <= t0) return;
  const step = stepFor(L);
  pctx.strokeStyle = color;
  pctx.lineWidth = width * dpr;
  pctx.lineCap = 'round'; pctx.lineJoin = 'round';
  pctx.beginPath();
  let g = geom(L, t0);
  pctx.moveTo(C + g.px * S, C + g.py * S);
  for (let t = t0 + step; t < t1; t += step) {
    g = geom(L, t);
    pctx.lineTo(C + g.px * S, C + g.py * S);
  }
  g = geom(L, t1);
  pctx.lineTo(C + g.px * S, C + g.py * S);
  pctx.stroke();
}

function redrawPaper() {
  pctx.fillStyle = PAPER[state.paper];
  pctx.fillRect(0, 0, paper.width, paper.height);
  for (const L of layers) for (const s of L.segs) paintRange(L, s.t0, s.t1, s.color, s.width);
}

function resize() {
  const w = sheet.getBoundingClientRect().width;
  if (!w) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const px = Math.round(w * dpr);
  for (const c of [paper, over]) { c.width = px; c.height = px; }
  C = px / 2;
  S = C * 0.97 / LIMIT;
  redrawPaper();
  drawOverlay();
}

// ---------- gears overlay ----------
function gearPath(ctx, cx, cy, N, rad, rot, h, inward) {
  const p = 2 * Math.PI / N;
  const base = inward ? rad + h / 2 : rad - h / 2;
  const tip = inward ? rad - h / 2 : rad + h / 2;
  const pt = (a, rr, first) => {
    const x = cx + rr * Math.cos(a), y = cy + rr * Math.sin(a);
    first ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  };
  for (let i = 0; i < N; i++) {
    const a = rot + i * p;
    pt(a, base, i === 0); pt(a + 0.2 * p, tip); pt(a + 0.5 * p, tip); pt(a + 0.7 * p, base);
  }
  ctx.closePath();
}

function drawOverlay() {
  octx.clearRect(0, 0, over.width, over.height);
  if (!state.showGears) return;
  const L = cur || makeLayer(state);
  const g = geom(L, L.t);
  const h = 1.5 * S;
  const dark = state.paper === 'black';
  const ringFill = dark ? 'rgba(120,160,255,0.16)' : 'rgba(60,110,240,0.12)';
  const ringLine = dark ? 'rgba(150,180,255,0.55)' : 'rgba(40,80,210,0.45)';
  const wheelFill = dark ? 'rgba(255,170,80,0.20)' : 'rgba(255,140,30,0.16)';
  const wheelLine = dark ? 'rgba(255,190,120,0.75)' : 'rgba(220,110,10,0.65)';
  octx.lineWidth = 1 * dpr;

  // fixed ring or centre gear
  octx.beginPath();
  if (L.mode === 'in') {
    octx.arc(C, C, (L.R + 9) * S, 0, Math.PI * 2);
    gearPath(octx, C, C, L.R, L.R * S, 0, h, true);
  } else {
    gearPath(octx, C, C, L.R, L.R * S, 0, h, false);
    octx.moveTo(C + 3 * S, C);
    octx.arc(C, C, 3 * S, 0, Math.PI * 2);
  }
  octx.fillStyle = ringFill; octx.fill('evenodd');
  octx.strokeStyle = ringLine; octx.stroke();

  // rolling wheel
  const wx = C + g.wx * S, wy = C + g.wy * S;
  octx.beginPath();
  gearPath(octx, wx, wy, L.r, L.r * S, g.spin, h, false);
  octx.fillStyle = wheelFill; octx.fill();
  octx.strokeStyle = wheelLine; octx.stroke();

  // spiral of pen holes, like the real plastic wheels
  octx.strokeStyle = wheelLine;
  const holes = Math.max(5, Math.round(L.r / 5));
  for (let i = 0; i < holes; i++) {
    const f = 0.12 + 0.8 * i / (holes - 1);
    if (Math.abs(f - L.hole) < 0.05) continue;
    const a = g.spin + 2.4 * (i + 1);
    octx.beginPath();
    octx.arc(wx + f * L.r * S * Math.cos(a), wy + f * L.r * S * Math.sin(a), 1.1 * S, 0, Math.PI * 2);
    octx.stroke();
  }
  octx.beginPath(); octx.arc(wx, wy, 1.6 * S, 0, Math.PI * 2); octx.stroke();

  // pen
  const seg = cur ? cur.segs[cur.segs.length - 1] : { color: state.color };
  const px = C + g.px * S, py = C + g.py * S;
  octx.beginPath(); octx.arc(px, py, Math.max(4 * dpr, 1.9 * S), 0, Math.PI * 2);
  octx.fillStyle = seg.color; octx.fill();
  octx.lineWidth = 2 * dpr; octx.strokeStyle = dark ? '#ffffff' : '#1a1e2c'; octx.stroke();
}

// ---------- drawing control ----------
function speedRad() { return 0.25 * Math.pow(1.6, state.speed - 1); }

function startLayer() {
  cur = makeLayer(state);
  layers.push(cur);
}
function completeCurrent() {
  cur = null; running = false;
}
function finishNow() {
  if (!cur) startLayer();
  const s = cur.segs[cur.segs.length - 1];
  paintRange(cur, cur.t, cur.T, s.color, s.width);
  s.t1 = cur.T; cur.t = cur.T;
  completeCurrent();
}
function liftWheel() {
  // gear geometry changed: keep what was drawn, start fresh next time
  if (cur) { if (cur.t === 0) layers.pop(); cur = null; running = false; }
}
function penChanged() {
  if (!cur) return;
  const s = cur.segs[cur.segs.length - 1];
  if (s.t1 > s.t0) cur.segs.push({ t0: cur.t, t1: cur.t, color: state.color, width: state.width });
  else { s.color = state.color; s.width = state.width; }
}

let last = performance.now();
function frame(ts) {
  const dt = Math.min(0.05, (ts - last) / 1000); last = ts;
  if (running && cur) {
    const nt = Math.min(cur.T, cur.t + speedRad() * dt);
    const s = cur.segs[cur.segs.length - 1];
    paintRange(cur, cur.t, nt, s.color, s.width);
    cur.t = nt; s.t1 = nt;
    if (nt >= cur.T) { completeCurrent(); syncUI(); }
  }
  drawOverlay();
  updateReadout();
  requestAnimationFrame(frame);
}

// ---------- UI ----------
const ringChips = $('ringChips'), wheelChips = $('wheelChips'), swatches = $('swatches');

function buildChips() {
  ringChips.innerHTML = '';
  for (const n of ringList()) {
    const b = document.createElement('button');
    b.className = 'chip'; b.textContent = n; b.id = 'ring-' + n;
    b.addEventListener('click', () => { state.R = n; fixParams(); liftWheel(); syncUI(); });
    ringChips.appendChild(b);
  }
  if (!wheelChips.childElementCount) {
    for (const n of WHEELS) {
      const b = document.createElement('button');
      b.className = 'chip'; b.textContent = n; b.id = 'wheel-' + n;
      b.addEventListener('click', () => { state.r = n; liftWheel(); syncUI(); });
      wheelChips.appendChild(b);
    }
  }
}
function buildSwatches() {
  for (const [name, hex] of PENS) {
    const b = document.createElement('button');
    b.className = 'sw'; b.style.background = hex; b.title = name;
    b.setAttribute('aria-label', name + ' pen'); b.dataset.color = hex;
    b.id = 'pen-' + name.replace(/\s/g, '');
    b.addEventListener('click', () => { state.color = hex; $('customColor').value = hex; penChanged(); syncUI(); });
    swatches.appendChild(b);
  }
}
function fixParams() {
  const rl = ringList();
  if (!rl.includes(state.R)) state.R = state.mode === 'in' ? 105 : 48;
  if (!wheelOk(state.r)) {
    const ok = WHEELS.filter(wheelOk);
    state.r = ok.reduce((best, n) => Math.abs(n - state.r) < Math.abs(best - state.r) ? n : best, ok[0]);
  }
  state.tooth = Math.min(state.tooth, state.R - 1);
}

function syncUI() {
  for (const b of document.querySelectorAll('#modeSeg button')) b.setAttribute('aria-pressed', b.dataset.mode === state.mode);
  for (const b of document.querySelectorAll('#paperSeg button')) b.setAttribute('aria-pressed', b.dataset.paper === state.paper);
  $('ringLabel').textContent = state.mode === 'in' ? 'Ring · teeth' : 'Centre gear · teeth';
  for (const b of ringChips.children) b.setAttribute('aria-pressed', +b.textContent === state.R);
  for (const b of wheelChips.children) {
    const n = +b.textContent;
    b.disabled = !wheelOk(n);
    b.title = b.disabled ? 'Too big: it would run off the paper' : n + '-tooth wheel';
    b.setAttribute('aria-pressed', n === state.r);
  }
  for (const b of swatches.children) b.setAttribute('aria-pressed', b.dataset.color.toLowerCase() === state.color.toLowerCase());
  $('hole').value = Math.round(state.hole * 100);
  $('holeOut').textContent = Math.round(state.hole * 100) + '% out';
  $('tooth').max = state.R - 1; $('tooth').value = state.tooth;
  $('toothOut').textContent = state.tooth + ' / ' + state.R;
  $('width').value = state.width; $('widthOut').textContent = state.width.toFixed(2) + ' px';
  $('speed').value = state.speed; $('speedOut').textContent = state.speed + ' / 10';
  $('showGears').checked = state.showGears;
  $('drawBtn').textContent = running ? 'Pause' : cur ? 'Resume' : 'Draw';
  updateReadout();
}
function updateReadout() {
  const L = cur || state;
  const g = gcd(L.R, L.r);
  const pts = L.R / g, trips = L.r / g;
  $('statShape').innerHTML = `<b>${pts}</b> points · wheel goes round <b>${trips}</b>×`;
  const pct = cur ? Math.floor(100 * cur.t / cur.T) + '%' : 'ready';
  $('statProgress').innerHTML = `layer <b>${layers.length + (cur ? 0 : 1)}</b> · <b>${pct}</b>`;
}

document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => {
  if (state.mode === b.dataset.mode) return;
  state.mode = b.dataset.mode; fixParams(); buildChips(); liftWheel(); syncUI();
}));
document.querySelectorAll('#paperSeg button').forEach(b => b.addEventListener('click', () => {
  state.paper = b.dataset.paper; redrawPaper(); syncUI();
}));
$('hole').addEventListener('input', e => { state.hole = e.target.value / 100; liftWheel(); syncUI(); });
$('tooth').addEventListener('input', e => { state.tooth = +e.target.value; liftWheel(); syncUI(); });
$('width').addEventListener('input', e => { state.width = +e.target.value; penChanged(); syncUI(); });
$('speed').addEventListener('input', e => { state.speed = +e.target.value; syncUI(); });
$('customColor').addEventListener('input', e => { state.color = e.target.value; penChanged(); syncUI(); });
$('showGears').addEventListener('change', e => { state.showGears = e.target.checked; });

$('drawBtn').addEventListener('click', () => {
  if (running) running = false;
  else { if (!cur) startLayer(); running = true; }
  syncUI();
});
$('finishBtn').addEventListener('click', () => { finishNow(); syncUI(); });
$('undoBtn').addEventListener('click', () => {
  running = false; cur = null; layers.pop(); redrawPaper(); syncUI();
});
$('clearBtn').addEventListener('click', () => {
  running = false; cur = null; layers = []; redrawPaper(); syncUI();
});
$('surpriseBtn').addEventListener('click', () => {
  liftWheel();
  const pick = a => a[Math.floor(Math.random() * a.length)];
  state.mode = Math.random() < 0.72 ? 'in' : 'out';
  buildChips();
  for (let tries = 0; tries < 40; tries++) {
    state.R = pick(ringList());
    const ok = WHEELS.filter(wheelOk);
    state.r = pick(ok);
    const trips = state.r / gcd(state.R, state.r);
    if (trips >= 2 && trips <= 16) break;
  }
  state.hole = (40 + Math.floor(Math.random() * 56)) / 100;
  state.tooth = Math.floor(Math.random() * state.R);
  const pens = PENS.filter(([, hex]) => hex !== PAPER[state.paper] &&
    !(state.paper === 'black' && hex === '#1d1f2b') && !(state.paper === 'white' && hex === '#f4f4ee'));
  state.color = pick(pens)[1]; $('customColor').value = state.color;
  startLayer(); running = !reduceMotion;
  if (reduceMotion) finishNow();
  syncUI();
});

// ---------- start with a drawing already on the paper ----------
buildChips(); buildSwatches();
resize();
new ResizeObserver(resize).observe(sheet);

const presets = [
  { mode: 'in', R: 150, r: 63, hole: 0.82, tooth: 0, color: '#0f9b8e', width: 1 },
  { mode: 'in', R: 150, r: 45, hole: 0.55, tooth: 7, color: '#7b4fd8', width: 1.5 }
];
for (const p of presets) { cur = makeLayer(p); layers.push(cur); finishNow(); }
startLayer();
if (reduceMotion) finishNow(); else running = true;
syncUI();
requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
